name: iOS CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'client/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/ios/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro,arch=arm64'
  DERIVED_DATA: ${{ github.workspace }}/client/ios/build

jobs:
  lint:
    name: SwiftLint & SwiftFormat
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install SwiftLint & SwiftFormat
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        working-directory: client/ios
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat (check only)
        working-directory: client/ios
        run: swiftformat --lint .

  build:
    name: Build and Test iOS Client
    needs: lint
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned Xcode version
        id: xcode-pin
        run: echo "version=$(sed 's/^Xcode //' client/ios/.xcode-version)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode-pin.outputs.version }}

      - name: Get Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | sed 's/Xcode //')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('client/ios/PastePoint.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ steps.xcode.outputs.version }}-

      - name: Boot iOS Simulator
        run: |
          xcrun simctl list devices available
          xcrun simctl boot "iPhone 17 Pro" || true

      - name: Resolve Swift Package Dependencies
        working-directory: client/ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PastePoint.xcodeproj \
            -scheme PastePoint \
            -derivedDataPath '${{ env.DERIVED_DATA }}'

      - name: Build for Testing
        working-directory: client/ios
        run: |
          xcodebuild build-for-testing \
            -project PastePoint.xcodeproj \
            -scheme PastePoint \
            -destination '${{ env.DESTINATION }}' \
            -derivedDataPath '${{ env.DERIVED_DATA }}' \
            -configuration Debug \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        working-directory: client/ios
        run: |
          xcodebuild test-without-building \
            -project PastePoint.xcodeproj \
            -scheme PastePoint \
            -destination '${{ env.DESTINATION }}' \
            -derivedDataPath '${{ env.DERIVED_DATA }}' \
            -configuration Debug \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        if: github.ref == 'refs/heads/main'
        working-directory: client/ios
        run: |
          xcodebuild build \
            -project PastePoint.xcodeproj \
            -scheme PastePoint \
            -destination '${{ env.DESTINATION }}' \
            -derivedDataPath '${{ env.DERIVED_DATA }}' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
