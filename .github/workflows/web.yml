name: Web CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'client/web/**'
      - '.github/workflows/web.yml'
      - 'scripts/acknowledgements/**'
  pull_request:
    branches: [main]
    paths:
      - 'client/web/**'
      - '.github/workflows/web.yml'
      - 'scripts/acknowledgements/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: ESLint & Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'npm'
          cache-dependency-path: client/web/package-lock.json

      - name: Install dependencies
        working-directory: client/web
        run: npm ci

      - name: ESLint
        working-directory: client/web
        run: npm run lint

      - name: Prettier
        working-directory: client/web
        run: npm run format

      - name: Third-party acknowledgements
        working-directory: client/web
        run: npm run acknowledgements:check

  build:
    name: Build and Test Web Client
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'npm'
          cache-dependency-path: client/web/package-lock.json

      - name: Install dependencies
        working-directory: client/web
        run: npm ci

      - name: Setup Chrome for testing
        uses: browser-actions/setup-chrome@latest

      - name: Run Tests
        working-directory: client/web
        run: npm run test:ci

      - name: Production Build
        working-directory: client/web
        run: npm run build -- --configuration=production
