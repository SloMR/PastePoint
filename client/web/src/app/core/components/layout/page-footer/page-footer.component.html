<!-- MARK: - Footer -->
<div
  class="flex w-full flex-col items-center gap-3 border-t px-4 py-3 bg-pageBackground dark:bg-baseDark dark:border-surfaceDark"
>
  <!-- Social links -->
  <div class="flex items-center gap-5">
    <app-social-links />
  </div>

  <!-- privacy · version · copyright -->
  <div
    class="flex flex-wrap items-center justify-center gap-x-1.5 gap-y-0.5 text-center text-[11px] font-expoArabicLight text-textMuted dark:text-textVeryMuted"
  >
    @if (showPrivacyLink) {
      <a
        routerLink="/privacy"
        rel="noopener noreferrer nofollow"
        class="text-brand transition-colors hover:underline dark:text-brandDark"
      >
        {{ 'PRIVACY_AND_TERMS' | translate }}
      </a>
      <span aria-hidden="true" class="opacity-50">·</span>
    }
    <span>{{ 'VERSION' | translate }} {{ appVersion }}</span>
    <span aria-hidden="true" class="opacity-50">·</span>
    <span>{{ 'COPYRIGHT_NOTICE' | translate }}</span>
  </div>
</div>
