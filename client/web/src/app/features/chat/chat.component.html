<!-- MARK: - Main Container -->
<div class="flex h-screen" [attr.dir]="isRTL ? 'rtl' : 'ltr'">
  <app-chat-sidebar
    [rooms]="rooms"
    [members]="members"
    [currentRoom]="currentRoom"
    [sessionCode]="SessionCode"
    [activeUploads]="activeUploads"
    [activeDownloads]="activeDownloads"
    [memberConnectionStatus]="memberConnectionStatus"
    [memberConnectionState]="memberConnectionState"
    [isRTL]="isRTL"
    [isDarkMode]="isDarkMode"
    [(isMenuOpen)]="isMenuOpen"
    [skipDrawerAnim]="skipDrawerAnim"
    [currentUser]="userService.user"
    [appVersion]="appVersion"
    [currentLanguage]="currentLanguage"
    (switchLanguage)="switchLanguage($event)"
    (joinRoomRequested)="joinRoom($event)"
    (createRoomRequested)="openCreateRoomPopup()"
    (copySessionCodeRequested)="copySessionCode()"
    (qrCodeRequested)="openQRCodePopup()"
    (createPrivateSessionRequested)="createPrivateSession()"
    (joinPrivateSessionRequested)="openJoinSessionPopup()"
    (endSessionRequested)="openEndSessionPopup()"
    (filePickerRequested)="openFilePickerForMember($event)"
    (cancelUploadRequested)="cancelUpload($event)"
    (cancelDownloadRequested)="cancelDownload($event)"
  />

  <!-- MARK: - Settings Panel Backdrop (small screens only) -->
  @if (isMenuOpen) {
    <div
      class="fixed inset-0 bg-black/40 z-[9999] backdrop-blur-[1px] md:hidden"
      (click)="isMenuOpen = false"
    ></div>
  }

  <!-- MARK: - Main Content Area -->
  <div class="relative flex-1 flex flex-col min-w-0 dark:bg-baseDark">
    <!-- MARK: - Chat Region (messages scroll behind the frosted bar) -->
    <div
      class="relative flex flex-1 flex-col overflow-hidden px-4 pb-6 bg-contentArea dark:bg-baseDark md:px-8"
      (dragover)="onChatDragOver($event)"
      (dragenter)="onChatDragEnter($event)"
      (dragleave)="onChatDragLeave($event)"
      (drop)="onChatDrop($event)"
    >
      <!-- MARK: - Drag & Drop Overlay (whole chat view) -->
      @if (isDraggingFiles) {
        <div
          class="pointer-events-none absolute inset-3 z-40 flex items-center justify-center rounded-2xl border-2 border-dashed bg-black/40 text-white backdrop-blur-sm border-primary-300 dark:border-secondary-400 md:inset-6"
        >
          <div class="flex flex-col items-center gap-3">
            <svg
              class="h-10 w-10 text-brand dark:text-brandDark"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
              />
            </svg>
            <span class="text-lg font-expoArabicMedium">{{ 'DROP_FILES_HERE' | translate }}</span>
          </div>
        </div>
      }

      <app-chat-messages
        [messages]="messages"
        [sessionCode]="SessionCode"
        [isRTL]="isRTL"
        [isDarkMode]="isDarkMode"
        [currentUser]="userService.user"
        (acceptFile)="acceptIncomingFile($event)"
        (declineFile)="declineIncomingFile($event)"
      />

      <!-- MARK: - Message Input -->
      <app-chat-input
        [(message)]="message"
        [isRTL]="isRTL"
        [isDarkMode]="isDarkMode"
        [hasNoConnectedPeers]="hasNoConnectedPeers"
        [isSendDisabled]="isSendDisabled"
        (messageSubmit)="sendMessage($event)"
        (enterKey)="onEnterKey($event.event, $event.form)"
        (autoResize)="autoResizeTextarea()"
        (filesAttached)="sendAttachments($event)"
      />
    </div>

    <!-- MARK: - Banners (overlay just below the frosted bar) -->
    <div
      class="pointer-events-none absolute inset-x-0 top-14 z-30 flex flex-col gap-2 px-4 md:px-8"
    >
      <div class="pointer-events-auto">
        <app-server-reconnect />
      </div>
      @if (!isReconnectingToServer) {
        <div class="pointer-events-auto">
          <app-connection-warning
            [show]="showConnectionWarning"
            (refreshed)="refreshPage()"
            (dismissed)="dismissConnectionWarning()"
          />
        </div>
      }
    </div>

    <!-- MARK: - Frosted Top Bar -->
    <div
      class="absolute inset-x-0 top-0 z-40 flex items-center h-14 px-4 md:px-8 bg-contentArea/10 backdrop-blur-md dark:bg-baseDark/10"
    >
      <!-- logo (large only) -->
      <img
        [src]="isDarkMode ? '/icons/pastepoint-dark.svg' : '/icons/pastepoint-light.svg'"
        alt="PastePoint Logo"
        title="PastePoint Logo"
        class="hidden h-7 w-auto md:block"
        loading="lazy"
        width="79"
        height="28"
      />

      <!-- room title -->
      <div
        class="pointer-events-none absolute inset-x-0 flex items-center justify-center gap-2 px-16"
      >
        @if (SessionCode.length > 0) {
          <img
            [src]="isDarkMode ? '/icons/lock-white.svg' : '/icons/lock.svg'"
            alt="Lock"
            title="Lock"
            class="h-4 w-4"
          />
        } @else {
          <img
            [src]="isDarkMode ? '/icons/users-white.svg' : '/icons/users.svg'"
            alt="Room"
            title="Room"
            class="h-4 w-4 opacity-80"
          />
        }
        <span class="truncate text-sm font-expoArabicMedium text-content dark:text-white">
          {{
            currentRoom == 'main'
              ? SessionCode.length > 0
                ? ('PRIVATE_ROOM' | translate)
                : ('PUBLIC_ROOM' | translate)
              : currentRoom
          }}
        </span>
      </div>

      <!-- toolbar -->
      <div class="ml-auto flex items-center gap-1">
        <!-- theme toggle -->
        <button
          type="button"
          (click)="toggleTheme()"
          class="flex h-10 w-10 items-center justify-center rounded-full text-content transition-colors hover:bg-inputBackground dark:text-white dark:hover:bg-surfaceDark"
          [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
          [attr.title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          @if (isDarkMode) {
            <svg
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
              />
            </svg>
          } @else {
            <svg
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
              />
            </svg>
          }
        </button>

        <!-- settings (small screens only; panel is docked on large) -->
        <button
          type="button"
          (click)="isMenuOpen = !isMenuOpen"
          class="flex h-10 w-10 items-center justify-center rounded-full text-content transition-colors hover:bg-inputBackground dark:text-white dark:hover:bg-surfaceDark md:hidden"
          aria-label="Settings"
          title="Settings"
          [attr.aria-expanded]="isMenuOpen"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- MARK: - Popups -->
    <app-join-session-popup
      [isOpen]="isOpenJoinSessionPopup"
      [(sessionCode)]="newSessionCode"
      (closed)="closePopup('join')"
      (submitted)="joinPrivateSession()"
    />

    <app-create-room-popup
      [isOpen]="isOpenCreateRoom"
      [(roomName)]="newRoomName"
      (closed)="closePopup('create')"
      (submitted)="createRoom()"
    />

    <app-end-session-popup
      [isOpen]="isOpenEndSessionPopup"
      (closed)="closePopup('end')"
      (confirmed)="endSession()"
    />

    <app-qr-code-popup
      [isOpen]="isOpenQRCodePopup"
      [isRTL]="isRTL"
      [sessionUrl]="sessionUrl"
      (closed)="closePopup('qr')"
    />
  </div>
</div>
