<!-- MARK: - Message Input -->
<form
  #messageForm="ngForm"
  (submit)="messageSubmit.emit(messageForm); $event.preventDefault()"
  class="flex w-full"
>
  <div
    class="relative mt-4 mb-0 flex w-full items-end gap-1.5 md:gap-2"
    [ngClass]="isRTL ? 'flex-row-reverse' : 'flex-row'"
  >
    <!-- MARK: - Attach & Emoji -->
    <div class="flex items-center gap-0.5 md:gap-1">
      <button
        type="button"
        [disabled]="hasNoConnectedPeers"
        (click)="fileInput.click()"
        class="flex h-8 w-8 items-center justify-center rounded-full transition-colors hover:bg-inputBackground disabled:opacity-30 disabled:grayscale disabled:cursor-not-allowed dark:hover:bg-borderDark md:h-9 md:w-9"
        [attr.aria-label]="
          (hasNoConnectedPeers ? 'NO_PEERS_CONNECTED' : 'ATTACH_FILES') | translate
        "
        [title]="(hasNoConnectedPeers ? 'NO_PEERS_CONNECTED' : 'ATTACH_FILES') | translate"
      >
        <img
          [src]="'/icons/link.svg'"
          alt=""
          class="h-4 w-4 md:h-[18px] md:w-[18px]"
          loading="lazy"
          width="18"
          height="18"
        />
      </button>
      <button
        type="button"
        (mouseenter)="openEmojiPicker()"
        (mouseleave)="handleEmojiIconMouseLeave()"
        class="flex h-8 w-8 items-center justify-center rounded-full transition-colors hover:bg-inputBackground dark:hover:bg-borderDark md:h-9 md:w-9"
        [attr.aria-label]="'Open emoji picker'"
        title="Open emoji picker"
      >
        <img
          [src]="'/icons/emoji.svg'"
          alt=""
          class="h-4 w-4 md:h-[18px] md:w-[18px]"
          loading="lazy"
          width="18"
          height="18"
        />
      </button>
    </div>

    <!-- MARK: - Pill Textarea -->
    <div
      class="flex flex-1 items-center rounded-3xl px-3 py-1 bg-inputBackground dark:bg-borderDark md:px-4 md:py-1.5"
    >
      <textarea
        #messageTextarea
        [ngModel]="message"
        (ngModelChange)="messageChange.emit($event); autoResize.emit()"
        name="message"
        rows="1"
        class="w-full resize-none overflow-hidden border-none bg-transparent p-0 align-middle outline-none font-expoArabicLight text-sm leading-6 text-content min-h-[24px] max-h-[120px] placeholder:text-secondary-400 dark:text-contentMuted md:text-base"
        [placeholder]="'TYPE_YOUR_MESSAGE' | translate"
        (keydown.enter)="enterKey.emit({ event: $any($event), form: messageForm })"
        (input)="autoResize.emit()"
      >
      </textarea>
    </div>

    <!-- MARK: - Send -->
    <button
      [disabled]="isSendDisabled"
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-white bg-brand disabled:opacity-50 disabled:cursor-not-allowed dark:bg-brandDark md:h-9 md:w-9"
      [attr.aria-label]="'SEND' | translate"
      [title]="'SEND' | translate"
    >
      <img
        [src]="'/icons/send.svg'"
        alt="Send"
        class="h-4 w-4 md:h-[18px] md:w-[18px]"
        [class.-scale-x-100]="isRTL"
        loading="lazy"
        width="18"
        height="18"
      />
    </button>

    <!-- MARK: - Emoji Picker -->
    <div
      class="absolute bottom-full z-10 mb-2 w-72 rounded-lg border shadow-lg border-primary-300 bg-primary-100 dark:border-secondary-600 dark:bg-secondary-800"
      [ngClass]="isRTL ? 'right-0' : 'left-0'"
      [ngStyle]="{
        opacity: isEmojiPickerVisible ? '1' : '0',
        pointerEvents: isEmojiPickerVisible ? 'auto' : 'none',
      }"
      (mouseenter)="isHoveringOverPicker = true"
      (mouseleave)="isHoveringOverPicker = false; isEmojiPickerVisible = false"
    >
      @if (isEmojiPickerVisible || isHoveringOverPicker) {
        <emoji-picker
          [class.dark]="isDarkMode"
          (emoji-click)="addEmoji($any($event))"
        ></emoji-picker>
      }
    </div>

    <!-- MARK: - Hidden File Input -->
    <input type="file" #fileInput (change)="filesAttached.emit($event)" multiple class="hidden" />
  </div>
</form>
