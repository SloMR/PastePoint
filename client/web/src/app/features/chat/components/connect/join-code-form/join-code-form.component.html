<div class="flex w-full gap-2">
  <input
    type="text"
    [(ngModel)]="code"
    (keydown.enter)="submit()"
    class="min-w-0 flex-1 rounded-lg border bg-transparent px-3 text-base h-[38px] border-inputBackground font-expoArabicMedium text-textMuted outline-none [font-size-adjust:0.4375] dark:border-surfaceDark dark:bg-surfaceDark dark:text-contentMuted"
    [placeholder]="'SESSION_CODE_PLACEHOLDER' | translate"
  />
  @if (showScan) {
    <button
      type="button"
      (click)="scanRequested.emit()"
      class="flex flex-shrink-0 items-center justify-center rounded-lg border w-[38px] h-[38px] border-brand text-brand hover:bg-brand/10 dark:border-brandDark dark:text-brandDark dark:hover:bg-brandDark/10"
      [title]="'SCAN_QR_CODE' | translate"
      [attr.aria-label]="'SCAN_QR_CODE' | translate"
    >
      <svg
        class="h-4 w-4"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M4 4m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
        <path d="M7 17l0 .01" />
        <path d="M14 4m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
        <path d="M7 7l0 .01" />
        <path d="M4 14m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
        <path d="M17 7l0 .01" />
        <path d="M14 14l3 0" />
        <path d="M20 14l0 .01" />
        <path d="M14 14l0 3" />
        <path d="M14 20l3 0" />
        <path d="M17 17l3 0" />
        <path d="M20 17l0 3" />
      </svg>
    </button>
  }
  <button
    type="button"
    (click)="submit()"
    [disabled]="!canJoin"
    class="flex-shrink-0 rounded-lg px-4 text-sm text-white h-[38px] bg-brand font-expoArabicMedium hover:bg-brand/80 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-brandDark dark:hover:bg-brandDark/80"
  >
    {{ 'JOIN' | translate }}
  </button>
</div>
