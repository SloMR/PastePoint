<!-- MARK: - QR Scanner Popup -->
@if (isOpen) {
  <div
    class="fixed inset-0 grid place-items-end bg-black/80 z-[10000] animate-fade-in sm:place-content-center"
    (click)="closed.emit()"
  >
    <div
      class="w-full rounded-2xl rounded-b-none bg-white px-4 py-8 pb-20 animate-slide-up scanner-active dark:bg-baseDark sm:w-[550px] sm:rounded-b-2xl sm:px-8 max-h-[90vh] overflow-y-auto supports-[height:100dvh]:max-h-[90dvh]"
      (click)="$event.stopPropagation()"
    >
      <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <h2
            class="font-semibold text-[22px] font-expoArabic text-content leading-[100%] dark:text-white"
          >
            {{ 'SCAN_QR_CODE' | translate }}
          </h2>
          <button
            type="button"
            (click)="closed.emit()"
            [attr.aria-label]="'CLOSE' | translate"
            class="flex items-center justify-center rounded-full p-2 transition-colors hover:bg-gray-100 dark:hover:bg-gray-700"
          >
            <img
              src="/icons/cross-close.svg"
              alt=""
              class="h-4 w-4"
              loading="lazy"
              width="16"
              height="16"
            />
          </button>
        </div>
        <div class="relative w-full overflow-hidden rounded-xl bg-black" style="aspect-ratio: 1">
          <video #videoEl autoplay playsinline muted class="h-full w-full object-cover"></video>
          <!-- Dimming overlay with rounded cutout -->
          <svg
            class="pointer-events-none absolute inset-0 h-full w-full"
            xmlns="http://www.w3.org/2000/svg"
            preserveAspectRatio="none"
          >
            <defs>
              <mask id="cutout">
                <rect width="100%" height="100%" fill="white" />
                <rect x="20%" y="20%" width="60%" height="60%" rx="12" fill="black" />
              </mask>
            </defs>
            <rect width="100%" height="100%" fill="rgba(0,0,0,0.55)" mask="url(#cutout)" />
          </svg>
          <!-- Pulsing corner brackets in brand color -->
          <svg
            class="scanner-brackets pointer-events-none absolute inset-0 h-full w-full text-brand dark:text-brandDark"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <!-- Top-left -->
            <path d="M 20 30 L 20 21.5 A 1.5 1.5 0 0 1 21.5 20 L 30 20" />
            <!-- Top-right -->
            <path d="M 70 20 L 78.5 20 A 1.5 1.5 0 0 1 80 21.5 L 80 30" />
            <!-- Bottom-right -->
            <path d="M 80 70 L 80 78.5 A 1.5 1.5 0 0 1 78.5 80 L 70 80" />
            <!-- Bottom-left -->
            <path d="M 30 80 L 21.5 80 A 1.5 1.5 0 0 1 20 78.5 L 20 70" />
          </svg>
          <canvas #canvasEl class="hidden"></canvas>
          @if (scannerError) {
            <div
              class="absolute inset-0 flex items-center justify-center bg-black/70 p-4 text-center text-sm text-white font-expoArabicMedium"
            >
              {{ scannerError | translate }}
            </div>
          }
        </div>
        <!-- Bottom instruction card -->
        <div
          class="flex items-center gap-3 rounded-2xl border border-borderLight bg-inputBackground px-4 py-3 dark:border-borderDark dark:bg-surfaceDark"
        >
          <svg
            class="h-6 w-6 shrink-0 text-brand dark:text-brandDark"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 7V5a2 2 0 012-2h2M21 7V5a2 2 0 00-2-2h-2M3 17v2a2 2 0 002 2h2M21 17v2a2 2 0 01-2 2h-2"
            />
            <rect x="7" y="7" width="10" height="10" rx="1.5" stroke-linejoin="round" />
            <rect x="10" y="10" width="4" height="4" rx="0.5" fill="currentColor" />
          </svg>
          <p class="text-sm font-expoArabicMedium text-content leading-snug dark:text-contentMuted">
            {{ 'POINT_CAMERA_AT_QR' | translate }}
          </p>
        </div>
      </div>
    </div>
  </div>
}
