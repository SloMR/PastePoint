<!-- MARK: - Server Reconnect Banner -->
@if (show()) {
  <div
    class="w-full rounded-xl border px-4 py-3 backdrop-blur-xl border-sky-400/30 bg-sky-500/15 dark:border-sky-400/20 dark:bg-sky-400/10"
  >
    <div class="flex items-start gap-3">
      <span
        class="mt-1.5 inline-flex h-2.5 w-2.5 shrink-0 animate-pulse rounded-full bg-sky-500 dark:bg-sky-400"
      ></span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-expoArabicMedium text-content dark:text-white">
          {{ 'SERVER_RECONNECT_TITLE' | translate }}
        </p>
        <p class="mt-1 text-xs text-textMuted dark:text-contentMuted">
          @if (secondsRemaining() > 0) {
            {{
              'SERVER_RECONNECT_COUNTDOWN'
                | translate: { seconds: secondsRemaining(), attempt: attempt() }
            }}
          } @else {
            {{ 'SERVER_RECONNECT_NOW' | translate: { attempt: attempt() } }}
          }
        </p>
      </div>
    </div>
  </div>
}
