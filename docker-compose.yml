services:
  # ---------- Certificate checker ----------
  cert-checker:
    image: alpine:3.21
    user: ${CONTAINER_USER:?CONTAINER_USER is required (set it in your .env file)}
    container_name: pastepoint-cert-checker
    entrypoint: |
      sh -c '
      if [ ! -f /etc/ssl/pastepoint/cert.pem ] || [ ! -f /etc/ssl/pastepoint/key.pem ]; then
        echo "ERROR: Missing SSL certificates!"
        echo "Please create ${CERT_PATH} directory with cert.pem and key.pem files"
        echo "Use generate-certs.sh script to generate self-signed certificates for development or provide your own for production."
        echo "Exiting..."
        exit 1
      fi
      echo "Certificates exist, continuing..."
      '
    volumes:
      - ${CERT_PATH:?CERT_PATH is required (set it in your .env file)}:/etc/ssl/pastepoint:ro
    restart: 'no'

  # ---------- Server container ----------
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        RUST_BUILD_MODE: ${RUST_BUILD_MODE:?RUST_BUILD_MODE is required (set it in your .env file)}
    container_name: pastepoint-server
    expose:
      - '9000'
    environment:
      - RUN_ENV=${SERVER_ENV:?SERVER_ENV is required (set it in your .env file)}
      - TURN_SECRET=${TURN_SECRET:-}
    volumes:
      - ${CERT_PATH}:/etc/ssl/pastepoint:ro
    depends_on:
      cert-checker:
        condition: service_completed_successfully
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - internal

  # ---------- Angular SSR container ----------
  ssr:
    build:
      context: .
      dockerfile: client/web/Dockerfile
      target: ssr
      args:
        NPM_BUILD_CONFIG: ${NPM_BUILD_CONFIG:?NPM_BUILD_CONFIG is required (set it in your .env file)}
    container_name: pastepoint-ssr
    environment:
      PORT: ${PORT:?PORT is required (set it in your .env file)}
      HOST: ${HOST:?HOST is required (set it in your .env file)}
    expose:
      - '4000'
    depends_on:
      server:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - internal

  # ---------- NGINX container ----------
  nginx:
    build:
      context: .
      dockerfile: client/web/Dockerfile
      target: nginx
      args:
        NPM_BUILD_CONFIG: ${NPM_BUILD_CONFIG:?NPM_BUILD_CONFIG is required (set it in your .env file)}
    container_name: pastepoint-nginx
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required (set it in your .env file)}
      SSL_CERT_PATH: /etc/ssl/pastepoint/cert.pem
      SSL_CERT_KEY_PATH: /etc/ssl/pastepoint/key.pem
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${CERT_PATH}:/etc/ssl/pastepoint:ro
    depends_on:
      ssr:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - internal

networks:
  internal:
    driver: bridge
