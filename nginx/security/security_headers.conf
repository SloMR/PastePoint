# Security headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# Define CSP directives as variables
set $default_src "'self'";

# Inline scripts are allowed by hash scripts/csp/check-inline-scripts.mjs fails the build when one changes.
set $script_src "'self' 'sha256-CU3CzKVHFUbLvpbyA36IIKoKTrlOqzjV70kvSHEqe4g=' 'sha256-dSDBwSE8glxBTY1+LvlNF0y1nlbDgtml2NUsYHQc4GQ=' 'sha256-VM2mZqyEQZoLzoTrp5EigFvzQ0+f1wSeBuoOn95WHCg=' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cloud.umami.is";

set $style_src "'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com";
set $img_src "'self' data: https://cdn.jsdelivr.net blob:";
set $font_src "'self' https://cdn.jsdelivr.net https://fonts.gstatic.com";
set $connect_src "'self' wss://${server_name}:* https://${server_name}:* https://cdn.jsdelivr.net https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io https://cloud.umami.is https://gateway.umami.is";
set $frame_ancestors "'none'";
set $form_action "'self'";
set $base_uri "'self'";
set $object_src "'none'";
set $worker_src "'self' blob: https://cdnjs.cloudflare.com";

set $content_security_policy "default-src $default_src; script-src $script_src; style-src $style_src; img-src $img_src; font-src $font_src; connect-src $connect_src; frame-ancestors $frame_ancestors; form-action $form_action; base-uri $base_uri; object-src $object_src; worker-src $worker_src";

add_header Content-Security-Policy $content_security_policy always;