# Define rate limiting zones
limit_req_zone  $binary_remote_addr  zone=root_req_limit:10m     rate=200r/m;
limit_req_zone  $binary_remote_addr  zone=general_req_limit:10m  rate=2000r/m;
limit_req_zone  $binary_remote_addr  zone=api_req_limit:10m      rate=500r/m;
limit_req_zone  $binary_remote_addr  zone=seo_req_limit:10m      rate=100r/m;
limit_req_zone  $binary_remote_addr  zone=strict_req_limit:10m   rate=50r/m;
limit_req_zone  $binary_remote_addr  zone=turn_cred_limit:10m    rate=20r/m;

# Connection‑concurrency control
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

# Drop the identifying part of the client address before it reaches disk
map $remote_addr $remote_addr_anon {
    ~(?P<ipv4>\d+\.\d+\.\d+)\.\d+$   $ipv4.0;
    ~(?P<ipv6>[^:]+:[^:]+):          $ipv6::;
    default                          0.0.0.0;
}

# Drop private session codes from logged request paths
map $request_uri $request_uri_anon {
    ~^/private/[^/?]+(?<rest>.*)$   /private/[code]$rest;
    ~^/ws/[^/?]+(?<rest>.*)$        /ws/[code]$rest;
    default                         $request_uri;
}

# Log format
log_format detailed '$remote_addr_anon - [$time_local] '
                    '"$request_method $request_uri_anon $server_protocol" $status $body_bytes_sent '
                    'limstat=$limit_req_status '
                    'rt=$request_time';

# Each server block sets access_log itself: a declaration at this level would sit beside
# the base image's full-address `main` log, and nginx writes to both.
# Error lines always carry the full client address and request, so only critical ones are kept.
error_log /var/log/nginx/error.log crit;

# Change rate limiting log level to notice instead of error
limit_req_log_level notice;
limit_conn_log_level notice;
