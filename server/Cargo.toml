[package]
name = "server"
version = "0.12.1"
edition = "2024"
authors = ["Sulaiman AlRomaih"]
license = "GPL-3"

[[bin]]
name = "server_bin"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4.13.0", features = ["openssl"] }
actix-ws = "0.4.0"
actix-http = "3.12.1"
actix-governor = "0.10.0"
actix-cors = "0.7.1"
actix-rt = "2.11.0"
tokio = { version = "1.52.1", features = ["sync", "macros", "time"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }

uuid = { version = "1.23.1", features = ["v4"] }
fake = "5.1.0"
derive_more = { version = "2.1.1", features = ["full"] }
openssl = { version = "0.10.80" }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
env_logger = "0.11.10"
log = "0.4.29"
rand = "0.10.1"
hmac = "0.12.1"
sha1 = "0.10.6"
base64 = "0.22.1"
bytes = "1.11.1"
config = "0.15.22"
dotenvy = "0.15.7"
url = "2.5.8"
sentry = { version = "0.48", features = ["log", "logs"] }
sentry-actix = "0.48"

[dev-dependencies]
actix-test = "0.1.5"
awc = "3.8.2"

[profile.release]
opt-level = 2   # 3 -> 2 trims LLVM codegen time; negligible runtime cost for a signaling server
strip = true    # strip symbols at link time
