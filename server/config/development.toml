[server]
bind_address = "0.0.0.0:9000"
key_file_path = "../certs/key.pem"
cert_file_path = "../certs/cert.pem"
auto_join = true
rate_limit_per_second = 100
rate_limit_burst_size = 200
log_level = "debug"
cors_allowed_origins = "https://127.0.0.1"

# Client update policy (GET /version). minimum = force floor, latest = soft nudge.
# Raise these only AFTER the build is live on the store/web, or you soft-brick users.
[client_version.ios]
minimum = "0.10.1"
latest = "0.10.1"
url = "https://apps.apple.com/app/id6788860511"

[client_version.web]
minimum = "0.21.1"
latest = "0.21.1"
url = "https://127.0.0.1"

[sentry]
# DSN is read from the SENTRY_DSN env var, never committed.
# SENTRY_ENABLED env var overrides `enabled` below.
enabled = false
environment = "development"
sample_rate = 1.0
traces_sample_rate = 0.1
