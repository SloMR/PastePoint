[server]
bind_address = "0.0.0.0:9000"
key_file_path = "/etc/ssl/pastepoint/key.pem"
cert_file_path = "/etc/ssl/pastepoint/cert.pem"
auto_join = true
rate_limit_per_second = 100
rate_limit_burst_size = 200
log_level = "debug"
cors_allowed_origins = "https://127.0.0.1"

[sentry]
# DSN is read from the SENTRY_DSN env var, never committed.
# SENTRY_ENABLED env var overrides `enabled` below.
enabled = false
environment = "docker-dev"
sample_rate = 1.0
