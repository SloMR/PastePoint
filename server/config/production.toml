[server]
bind_address = "0.0.0.0:9000"
key_file_path = "/etc/ssl/pastepoint/key.pem"
cert_file_path = "/etc/ssl/pastepoint/cert.pem"
auto_join = true
rate_limit_per_second = 50
rate_limit_burst_size = 100
log_level = "info"
cors_allowed_origins = "https://pastepoint.com"

# Client update policy (GET /version). minimum = force floor, latest = soft nudge.
# Raise these only AFTER the build is live on the store/web, or you soft-brick users.
[client_version.ios]
minimum = "0.13.0"
latest = "0.13.0"
url = "https://apps.apple.com/app/id6788860511"

[client_version.web]
minimum = "0.24.0"
latest = "0.24.0"
url = "https://pastepoint.com"

[sentry]
# DSN is read from the SENTRY_DSN env var, never committed.
# SENTRY_ENABLED env var overrides `enabled` below.
enabled = true
environment = "production"
sample_rate = 1.0
traces_sample_rate = 0.1

# TURN relay for GET /turn-credentials. urls are the fixed public relay (same in
# every env); the shared secret comes from the TURN_SECRET env var, never here.
[turn]
urls = ["turn:turn.pastepoint.com:3478", "turns:turn.pastepoint.com:5349"]
ttl_seconds = 1800
